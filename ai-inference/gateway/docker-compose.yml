services:
  demo-api:
    build: .
    image: ghcr.io/nivedmahendran/proxmox-ai-demo-api:latest
    container_name: demo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://10.10.10.120:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
