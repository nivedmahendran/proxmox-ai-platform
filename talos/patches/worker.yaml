  network:
    interfaces:
      - interface: eth0
        addresses:
          - 10.10.10.203/22
        routes:
          - network: 0.0.0.0/0
            gateway: 10.10.10.1
    nameservers:
      - 10.10.10.1
      - 1.1.1.1
  install:
    disk: /dev/sda
