# Prometheus scrape config — used by the obs container.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: demo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.10.121:8000"]

  - job_name: node
    static_configs:
      - targets: ["10.10.10.120:9100"]
